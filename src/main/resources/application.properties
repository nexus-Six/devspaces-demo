# Cluster-specific Dev Spaces URL: set in gitignored .env (see .env.example)
demo.github.repo=https://github.com/nexus-Six/devspaces-demo
demo.devspaces.branch=v1
demo.devspaces.devfile-path=devfile.yaml

# Bind on all interfaces so Dev Spaces / OpenShift Routes can reach the app
# (IDE "Run Quarkus" does not pass -Dquarkus.http.host from the devfile).
quarkus.http.host=0.0.0.0

# Honour X-Forwarded-* from the Dev Spaces / OpenShift ingress proxy.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Dev UI CORS only allows localhost by default; disable in remote workspaces.
%dev.quarkus.dev-ui.cors.enabled=false
